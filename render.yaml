services:
  - type: "web"
    runtime: "static"
    name: "les-viandes-maska"
    rootDir: "."
    buildCommand: "echo prebuilt"
    staticPublishPath: "."
    autoDeployTrigger: "commit"
    previews:
      generation: "off"
    headers:
      - path: "/*"
        name: "X-Robots-Tag"
        value: "noindex, nofollow, noarchive"
      - path: "/*"
        name: "X-Content-Type-Options"
        value: "nosniff"
      - path: "/*"
        name: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: "X-Frame-Options"
        value: "DENY"
      - path: "/*"
        name: "Permissions-Policy"
        value: "camera=(), microphone=(), geolocation=()"
      - path: "/*"
        name: "Content-Security-Policy"
        value: "default-src 'self'; media-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests"
      - path: "/assets/*"
        name: "Cache-Control"
        value: "public, max-age=3600"
    routes:
      - type: "redirect"
        source: "/produits"
        destination: "/produits.html"
      - type: "redirect"
        source: "/sur-mesure"
        destination: "/sur-mesure.html"
      - type: "redirect"
        source: "/distribution"
        destination: "/distribution.html"
      - type: "redirect"
        source: "/a-propos"
        destination: "/a-propos.html"
      - type: "redirect"
        source: "/carrieres"
        destination: "/carrieres.html"
      - type: "redirect"
        source: "/contact"
        destination: "/contact.html"
      - type: "redirect"
        source: "/demande"
        destination: "/demande.html"
      - type: "redirect"
        source: "/confidentialite"
        destination: "/confidentialite.html"
      - type: "redirect"
        source: "/en/products"
        destination: "/en/products.html"
      - type: "redirect"
        source: "/en/custom-cut"
        destination: "/en/custom-cut.html"
      - type: "redirect"
        source: "/en/distribution"
        destination: "/en/distribution.html"
      - type: "redirect"
        source: "/en/about"
        destination: "/en/about.html"
      - type: "redirect"
        source: "/en/careers"
        destination: "/en/careers.html"
      - type: "redirect"
        source: "/en/contact"
        destination: "/en/contact.html"
      - type: "redirect"
        source: "/en/inquiry"
        destination: "/en/inquiry.html"
      - type: "redirect"
        source: "/en/privacy"
        destination: "/en/privacy.html"
